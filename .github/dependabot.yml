version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version is caught first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version is caught first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
