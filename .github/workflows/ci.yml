name: ci

# Safe for pull requests from forks: this uses `pull_request` (never `pull_request_target`),
# so fork PRs run with a read-only token and no secrets. Every action is pinned to a commit.
#
# The site has three cuts: `main` is published at the root, the `v3` branch at /v3/ and the
# `v4` branch at /v4/. Every deploy builds all three branches, so publishing one never knocks
# the others off the air. Only `main` may deploy to the github-pages environment; a green
# push to `v3` or `v4` asks main's workflow to run, which rebuilds everything and deploys.
on:
  push:
    branches: [main, v3, v4]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  workflows:
    name: workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  build:
    name: test and build
    # Pinned: Playwright's browser installer does not support newer Ubuntu images yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:artifact
      # E2E runs on the Google Chrome preinstalled on GitHub's Ubuntu image. Playwright's
      # own installer apt-gets dozens of font packages, which is slow and flaky.
      - run: google-chrome --version
      - run: npm run e2e
        timeout-minutes: 8
        env:
          PW_CHANNEL: chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screens
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-artifact
          path: dist-artifact/godstack.html

  # A green v3 or v4 asks main to publish (workflow_dispatch is one of the two events a
  # GITHUB_TOKEN may trigger). The deploy itself only ever runs from main.
  publish:
    name: ask main to publish
    needs: [lint, workflows, build]
    if: (github.ref == 'refs/heads/v3' || github.ref == 'refs/heads/v4') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # Every cut is built fresh from its branch, so the published site is never half of one.
  site:
    name: assemble the site
    needs: [lint, workflows, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v3
          path: v3
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v4
          path: v4
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: main
      - run: npm ci && npm run build
        working-directory: v3
      - run: npm ci && npm run build
        working-directory: v4
      - run: |
          mkdir -p site/v3 site/v4
          cp main/dist/index.html site/index.html
          cp v3/dist/index.html site/v3/index.html
          cp v4/dist/index.html site/v4/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
